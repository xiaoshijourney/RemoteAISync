# RemoteAISync public WSS relay for relay.example.com.
# Install the server block after the TLS certificate exists. Keep the Dart
# relay bound to 127.0.0.1:8920; do not expose that port publicly.

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.example.com;

    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    # The relay is a WebSocket endpoint. Nginx forwards only public relay
    # paths; the admin API remains loopback-only.
    location = /relay {
        proxy_pass http://127.0.0.1:8920/relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8920/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /register-host {
        proxy_pass http://127.0.0.1:8920/register-host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin/ {
        return 404;
    }

    location / {
        return 404;
    }
}
